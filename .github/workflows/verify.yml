name: Verify synthetic incidents
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.1'
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: make verify
      - run: git diff --exit-code -- seeds cases
