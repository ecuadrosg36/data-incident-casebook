[project]
name = "data-incident-casebook"
version = "0.1.0"
description = "Reproducible data incidents: symptom, hypotheses, evidence, root cause, fix, before and after."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Enmanuel Cuadros" }]
dependencies = ["duckdb>=1.1"]

[project.scripts]
casebook = "casebook.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casebook"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "--cov=casebook --cov-report=term-missing"
